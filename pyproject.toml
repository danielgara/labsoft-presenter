[project]
name = "presenter"
version = "1.0.0"
description = "Highlight, magnify, and write over any presentation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.7",
    "pynput>=1.7.7",
    "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=11.0; sys_platform == 'darwin'",
]

[project.scripts]
presenter = "presenter.__main__:main"

[dependency-groups]
package = [
    "pyinstaller>=6.11",
]

[tool.uv]
# pynput pulls evdev on Linux only for its uinput backend; Presenter uses xorg,
# and evdev has no wheels, so it would need a compiler and kernel headers.
override-dependencies = ["evdev; sys_platform == 'never'"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["presenter*"]
